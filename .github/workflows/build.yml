name: بناء أبو وهب ونشره

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (OCR + translation + overlay)
        env:
          PYTHONIOENCODING: utf-8
          SMOKE_OUT: smoke-out
        run: python tests/smoke_windows.py
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onedir --windowed --name AbuWahab
          --icon icon.ico --add-data "fonts;fonts" --add-data "icon.ico;." --add-data "words_en.txt;."
          --collect-submodules winrt main.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/AbuWahab/
          Copy-Item docs/*.png dist/AbuWahab/
          Compress-Archive -Path dist/AbuWahab/* -DestinationPath AbuWahab-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AbuWahab-Windows
          path: AbuWahab-Windows.zip
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path main.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          Copy-Item "docs/طريقة-التثبيت.png" Install-Guide.png
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete-asset $tag "-.png" -y 2>$null
            gh release upload $tag AbuWahab-Windows.zip Install-Guide.png --clobber
          } else {
            gh release create $tag AbuWahab-Windows.zip Install-Guide.png `
              --target $env:GITHUB_SHA --title "أبو وهب $tag" --notes-file docs/release-notes.md --latest
          }
